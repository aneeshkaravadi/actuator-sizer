[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actuator-sizer"
version = "0.1.0"
description = "Humanoid actuator sizing from MuJoCo inverse dynamics: lift requirements, gear-ratio trades, winding temperature, series elasticity, CAD envelope."
authors = [{ name = "Aneesh Karavadi" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "mujoco>=3.1"]

[project.optional-dependencies]
cad = ["build123d>=0.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
